[project]
name = "mtga-constructed-testing-client"
version = "0.3.0"
description = "Desktop MTG Arena telemetry client for constructed testing groups."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "keyring>=25.6",
  "platformdirs>=4.3",
  "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
cta-client = "cta_client.follower:main"
cta-client-gui = "cta_client.desktop.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
