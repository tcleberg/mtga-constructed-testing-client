[project]
name = "mtga-constructed-testing-client"
version = "0.1.0"
description = "Desktop client for MTG Arena constructed testing telemetry."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PySide6-Essentials>=6.7,<7",
  "keyring>=25,<26",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pyinstaller>=6.10,<7"]
build-macos = ["create-dmg>=1.1,<2"]

[project.scripts]
mtga-constructed-testing-client = "cta_client.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
