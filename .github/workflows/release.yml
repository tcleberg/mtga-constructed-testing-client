name: Release installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
            arch: arm64
          - os: macos-15-intel
            artifact: macos-x64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,build]"
      - run: python -m pytest
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
          CTA_DEFAULT_SERVER_URL: ${{ vars.CTA_DEFAULT_SERVER_URL }}
        run: |
          $env:APP_VERSION = $env:APP_VERSION.TrimStart('v')
          ./packaging/scripts/build_windows.ps1
      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg
      - name: Build macOS image
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
          CTA_DEFAULT_SERVER_URL: ${{ vars.CTA_DEFAULT_SERVER_URL }}
        run: |
          export APP_VERSION="${APP_VERSION#v}"
          chmod +x packaging/scripts/build_macos.sh
          packaging/scripts/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Combine checksums
        run: cat release/SHA256SUMS-*.txt | sort > release/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
            release/SHA256SUMS.txt
