name: Release installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
            arch: arm64
          - os: macos-15-intel
            artifact: macos-x64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # Job level rather than step level so the signing steps can test for
    # them: a step's own `env` is not visible to its own `if`.
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,build]"
      - run: python -m pytest
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
          CTA_DEFAULT_SERVER_URL: ${{ vars.CTA_DEFAULT_SERVER_URL }}
        run: |
          $env:APP_VERSION = $env:APP_VERSION.TrimStart('v')
          ./packaging/scripts/build_windows.ps1
      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg
      - name: Load signing credentials
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          # A runner has no keychain to sign from, so build a throwaway one
          # and make it the default for the rest of the job.
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "${PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${PASSWORD}" "${KEYCHAIN}"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -f pkcs12
          rm -f "${RUNNER_TEMP}/cert.p12"
          # Without this, codesign wants interactive permission to use the
          # key and fails with errSecInternalComponent on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychain -d user -s "${KEYCHAIN}" login.keychain-db
          # notarytool reads the key from a file, not the environment.
          printf '%s' "${APPLE_API_KEY}" | base64 --decode > "${RUNNER_TEMP}/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/AuthKey.p8" >> "${GITHUB_ENV}"
      - name: Build macOS image
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ github.ref_name }}
          TARGET_ARCH: ${{ matrix.arch }}
          CTA_DEFAULT_SERVER_URL: ${{ vars.CTA_DEFAULT_SERVER_URL }}
        run: |
          export APP_VERSION="${APP_VERSION#v}"
          chmod +x packaging/scripts/build_macos.sh
          packaging/scripts/build_macos.sh
      - name: Discard signing credentials
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          rm -f "${RUNNER_TEMP}/AuthKey.p8"
          if [[ -f "${RUNNER_TEMP}/signing.keychain-db" ]]; then
            security delete-keychain "${RUNNER_TEMP}/signing.keychain-db"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Combine checksums
        run: cat release/SHA256SUMS-*.txt | sort > release/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.dmg
            release/SHA256SUMS.txt
