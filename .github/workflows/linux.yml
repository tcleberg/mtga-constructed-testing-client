name: Linux archive

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        default: "0.3.2"
      release_tag:
        description: Existing GitHub release to attach the archive to
        default: "v0.3.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,build]"
      - run: python -m pytest
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-cursor0 libdbus-1-3
      - name: Build Linux archive
        env:
          APP_VERSION: ${{ inputs.version }}
          TARGET_ARCH: x86_64
          CTA_DEFAULT_SERVER_URL: ${{ vars.CTA_DEFAULT_SERVER_URL }}
        run: |
          chmod +x packaging/scripts/build_linux.sh
          packaging/scripts/build_linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: artifacts/*
          if-no-files-found: error
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            artifacts/MTGA-Constructed-Testing-${{ inputs.version }}-linux-x86_64.tar.gz \
            artifacts/SHA256SUMS-linux-x86_64.txt \
            --clobber
